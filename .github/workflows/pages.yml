name: Deploy to GitHub Pages

# Builds the browser export from source on the single canonical branch and
# publishes it to GitHub Pages.
#
# Deliberately builds rather than publishing the committed export: the deployed
# game is then guaranteed to correspond to the source at that commit, so a
# forgotten `export_web.sh` can never ship a stale build. The copy committed under
# exports/ stays as a fallback for deploying without CI.
#
# There is no gh-pages branch. Pages is served from the Actions artifact produced
# by this workflow, on `main`.

on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  # Allows a redeploy without a code change.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, but let a newer push finish rather than
# cancelling it — a half-deployed Pages site is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Must match docs/ENVIRONMENT.md and scripts/lib.sh.
  GODOT_VERSION: 4.7.2

jobs:
  build:
    name: Export web build
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot ${{ env.GODOT_VERSION }} and web templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          cd ~/godot

          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip"
          unzip -oq godot.zip
          chmod +x "Godot_v${V}_linux.x86_64"

          curl -fsSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz"
          unzip -oq templates.tpz

          # The directory name must match Godot's version string exactly or the
          # export fails with "no export template found".
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL"
          cp templates/web* "$TPL/"
          rm -rf templates templates.tpz godot.zip

      - name: Put Godot on PATH
        run: |
          echo "$HOME/godot" >> "$GITHUB_PATH"
          ln -sf "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot/godot"

      - name: Verify toolchain
        run: |
          godot --version
          ls -la "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Validate project
        run: ./scripts/validate.sh

      - name: Gameplay test (autopilot must complete the level)
        run: ./scripts/test_headless.sh

      - name: Export web build
        run: ./scripts/export_web.sh

      - name: Add a no-Jekyll marker
        # Without this, Pages runs the output through Jekyll, which strips files
        # and directories beginning with an underscore.
        run: touch exports/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: exports/web

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
